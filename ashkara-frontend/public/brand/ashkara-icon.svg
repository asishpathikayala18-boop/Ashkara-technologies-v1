<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8D77B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6A12"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D9D9D9"/>
      <stop offset="100%" stop-color="#8D939A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="228" fill="#070B14"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#12304F" stroke-width="3"/>

  <!-- Gold A -->
  <path d="M256 70 L385 430 L330 430 L256 214 L182 430 L127 430 Z"
        fill="url(#gold)" filter="url(#glow)"/>

  <!-- Silver swoosh -->
  <path d="M108 310
           C180 258 248 236 392 248
           C305 275 233 307 120 343 Z"
        fill="url(#silver)"/>

  <!-- Progress bars -->
  <rect x="120" y="230" width="20" height="110" rx="4" fill="url(#silver)"/>
  <rect x="150" y="190" width="20" height="150" rx="4" fill="url(#silver)"/>
  <rect x="180" y="150" width="20" height="190" rx="4" fill="url(#silver)"/>
</svg>
